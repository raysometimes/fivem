name: FiveM Perf DXVK VBlank StdSleep

on:
  push:
    branches:
      - diagnostics/perf-dxvk-vblank-stdsleep

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DXVK_REPO: https://github.com/doitsujin/dxvk.git
      DXVK_COMMIT: 70d7508c01201ed3d4bfb33da42ba834eafe3857
      BUILD_NAME: fivem-vblank-ab

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build mingw-w64 glslang-tools python3

      - name: Checkout exact DXVK v3.1 source
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive "$DXVK_REPO" dxvk
          cd dxvk
          git checkout --detach "$DXVK_COMMIT"
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "$DXVK_COMMIT"
          test -z "$(git status --porcelain)"

      - name: Build CONTROL once
        shell: bash
        run: |
          set -euxo pipefail
          cd dxvk
          ./package-release.sh "$BUILD_NAME" ../out --dev-build --64-only
          test -f "../out/dxvk-$BUILD_NAME/x64/dxgi.dll"
          test -f "../out/dxvk-$BUILD_NAME/x64/d3d11.dll"

          mkdir -p ../artifact/control ../artifact/patched
          cp "../out/dxvk-$BUILD_NAME/x64/dxgi.dll" ../artifact/control/
          cp "../out/dxvk-$BUILD_NAME/x64/d3d11.dll" ../artifact/control/

          git describe --dirty=+ > ../artifact/control-version.txt
          sha256sum ../artifact/control/dxgi.dll ../artifact/control/d3d11.dll

      - name: Apply exact one-line VBlank patch and freeze VCS metadata
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          p = Path("dxvk/src/dxgi/dxgi_output.cpp")
          s = p.read_text()
          old = "    Sleep::sleepUntil(t1, t2);"
          new = "    std::this_thread::sleep_until(t2);"
          assert s.count(old) == 1
          assert new not in s
          p.write_text(s.replace(old, new))
          PY

          test "$(git -C dxvk diff --name-only)" = "src/dxgi/dxgi_output.cpp"
          test "$(git -C dxvk diff --numstat -- src/dxgi/dxgi_output.cpp)" = $'1\t1\tsrc/dxgi/dxgi_output.cpp'
          git -C dxvk --no-pager diff -- src/dxgi/dxgi_output.cpp

          # Audit the patch BEFORE hiding it from git describe.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p = Path("dxvk/src/dxgi/dxgi_output.cpp")
          work = p.read_text()
          base = subprocess.check_output(
              ["git","-C","dxvk","show","HEAD:src/dxgi/dxgi_output.cpp"],
              text=True)
          old = "    Sleep::sleepUntil(t1, t2);"
          new = "    std::this_thread::sleep_until(t2);"
          assert base.count(old) == 1 and new not in base
          assert work == base.replace(old, new)
          PY

          # DXVK's Meson vcs_tag uses: git describe --dirty=+
          # Hide only the already-audited test file so CONTROL/PATCHED
          # keep identical embedded version metadata.
          git -C dxvk update-index --assume-unchanged src/dxgi/dxgi_output.cpp

          test "$(git -C dxvk describe --dirty=+)" = "$(cat artifact/control-version.txt)"

      - name: Incrementally build PATCHED from same tree
        shell: bash
        run: |
          set -euxo pipefail
          ninja -C "out/dxvk-$BUILD_NAME/build.64" install

          cp "out/dxvk-$BUILD_NAME/x64/dxgi.dll" artifact/patched/
          cp "out/dxvk-$BUILD_NAME/x64/d3d11.dll" artifact/patched/

      - name: Audit exact A-B outputs
        shell: bash
        run: |
          set -euxo pipefail

          CONTROL_DXGI_SHA256=$(sha256sum artifact/control/dxgi.dll | awk '{print $1}')
          CONTROL_D3D11_SHA256=$(sha256sum artifact/control/d3d11.dll | awk '{print $1}')
          PATCHED_DXGI_SHA256=$(sha256sum artifact/patched/dxgi.dll | awk '{print $1}')
          PATCHED_D3D11_SHA256=$(sha256sum artifact/patched/d3d11.dll | awk '{print $1}')

          echo "CONTROL_DXGI_SHA256=$CONTROL_DXGI_SHA256"
          echo "CONTROL_D3D11_SHA256=$CONTROL_D3D11_SHA256"
          echo "PATCHED_DXGI_SHA256=$PATCHED_DXGI_SHA256"
          echo "PATCHED_D3D11_SHA256=$PATCHED_D3D11_SHA256"

          test "$CONTROL_DXGI_SHA256" != "$PATCHED_DXGI_SHA256"

          # No D3D11 source changed. With frozen VCS metadata, D3D11 must
          # now remain byte-identical too; otherwise reject the experiment.
          cmp artifact/control/d3d11.dll artifact/patched/d3d11.dll
          test "$CONTROL_D3D11_SHA256" = "$PATCHED_D3D11_SHA256"

          # Re-verify exact patched file contents even though assume-unchanged
          # intentionally hides it from ordinary git diff.
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          p = Path("dxvk/src/dxgi/dxgi_output.cpp")
          work = p.read_text()
          base = subprocess.check_output(
              ["git","-C","dxvk","show","HEAD:src/dxgi/dxgi_output.cpp"],
              text=True)
          old = "    Sleep::sleepUntil(t1, t2);"
          new = "    std::this_thread::sleep_until(t2);"
          assert work == base.replace(old, new)
          PY

          cat > artifact/identity.txt <<EOF
          DXVK_COMMIT=$DXVK_COMMIT
          BUILD_NAME=$BUILD_NAME
          PATCH_FILE=src/dxgi/dxgi_output.cpp
          OLD=Sleep::sleepUntil(t1, t2);
          NEW=std::this_thread::sleep_until(t2);
          INSTALLED_DECK_DXGI_SHA256=49cd72ff238d217da9f308a21b58530f3bbd080c9d2034317d21800c19074fdd
          INSTALLED_DECK_D3D11_SHA256=0ec7afc6fd0b6a9c3896eb8cde6c4d5b384b1fb0ddf826d21455e9dbeb6defee
          CONTROL_DXGI_SHA256=$CONTROL_DXGI_SHA256
          CONTROL_D3D11_SHA256=$CONTROL_D3D11_SHA256
          PATCHED_DXGI_SHA256=$PATCHED_DXGI_SHA256
          PATCHED_D3D11_SHA256=$PATCHED_D3D11_SHA256
          EOF

      - name: Upload CONTROL and PATCHED artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: FiveM-perf-dxvk-vblank-stdsleep
          path: artifact
          if-no-files-found: error

      - name: Report artifact identity
        shell: bash
        run: |
          echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "ARTIFACT_ZIP_SHA256=${{ steps.upload.outputs.artifact-digest }}"
